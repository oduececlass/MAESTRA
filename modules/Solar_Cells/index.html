{id:'overview',num:'0',group:'Course Orientation',title:'Solar Cells for Solid-State Electronics',subtitle:'A device-physics learning path from photons and energy bands to junction transport, J–V behavior, and optical-device design.',keywords:'course map roadmap solid state electronics solar cells device physics prerequisites learning objectives hydraulic metaphor simulation',html:()=>String.raw`
<div class="courseMap">
<section class="courseHero"><div><span class="badge">Reorganized course sequence</span><h3>Learn the device from the inside out</h3><p>This ebook follows the logic of a solid-state electronics course: begin with photon energy, semiconductor structure, and junction electrostatics; add optical generation and carrier transport; derive terminal current and voltage; then diagnose losses and optimize the optical and electrical design.</p><div class="chapterDivider">Central question: how does an absorbed photon become useful electrical power?</div></div>${figOverview()}</section>

<div class="figureBox"><span class="badge">Opening visual metaphor</span><h3>Solar cell as a hydraulic head–flow energy converter</h3><img src="assets/solar_cell_hydraulic_metaphor.png" alt="Solar-cell hydraulic head-flow metaphor relating photons, voltage, current density, load, and power" style="display:block;width:100%;max-width:100%;height:auto;margin:10px auto;border-radius:16px;" loading="eager"><div class="figureCaption">The metaphor maps photon energy to carrier lift, voltage to hydraulic head, current density to flow rate, and electrical power to head multiplied by flow. The external load selects the operating point on the illuminated J–V curve, while the maximum-power point gives the best voltage–current tradeoff.</div></div>

<div class="card"><h3>Solid-state interpretation of the metaphor</h3><div class="keyGrid"><div class="key"><b>Photons lift carriers</b>Absorption transfers energy to the semiconductor and creates nonequilibrium electron–hole pairs.</div><div class="key"><b>Voltage is energy per charge</b>The quasi-Fermi-level separation provides the electrical head available at the terminals.</div><div class="key"><b>Current is carrier flow</b>Drift, diffusion, collection probability, and the external circuit determine the delivered current density.</div><div class="key"><b>Load sets the operating point</b>Short circuit favors current, open circuit favors voltage, and the MPP maximizes \(P=VJ\).</div></div></div>

<div class="simBox"><span class="badge">Interactive metaphor laboratory</span><h3>Photovoltaic Waterworks: load, illumination, temperature, J–V, and power</h3><p>Adjust illumination, load resistance, and temperature. The animated carrier loop, hydraulic head, waterwheel, illuminated J–V curve, load line, power curve, and photovoltaic metrics update together.</p><div class="metaphorLaunch"><a class="pageBtn metaphorOpenBtn" href="modules/solar_cell_loop_metaphor.html" target="_blank" rel="noopener">Open simulator in a new window ↗</a></div><iframe title="Photovoltaic Waterworks hydraulic metaphor simulator" src="modules/solar_cell_loop_metaphor.html" style="display:block;width:100%;height:1040px;border:1px solid var(--stroke);border-radius:16px;background:#050b18;" loading="lazy"></iframe><div class="figureCaption">The simulator uses an analytic illuminated single-diode model. Its AI-tutor panel is optional and requires a user-configured backend; the physics visualization and controls work independently.</div></div>

<div class="courseSequence"><article class="courseStep"><span class="stepNum">1</span><h4>Foundations</h4><p>Photon energy, bandgap, absorption, doping, depletion width, electric field, and device structure.</p></article><article class="courseStep"><span class="stepNum">2</span><h4>Photovoltaic operation</h4><p>Generation, quasi-Fermi-level splitting, drift, diffusion, recombination, and collection probability.</p></article><article class="courseStep"><span class="stepNum">3</span><h4>Electrical characteristics</h4><p>Illuminated diode equation, equivalent circuit, J–V behavior, maximum power, and efficiency.</p></article><article class="courseStep"><span class="stepNum">4</span><h4>Optical and device design</h4><p>Multilayer optical stacks, interference, absorber thickness, and absorption–collection tradeoffs.</p></article></div>
<section class="card"><h3>Recommended prerequisites</h3><div class="prereqGrid"><div class="prereq"><b>Semiconductor statistics</b>Carrier concentration, Fermi level, and thermal voltage.</div><div class="prereq"><b>p–n junctions</b>Built-in potential, depletion approximation, and diode current.</div><div class="prereq"><b>Transport</b>Drift, diffusion, mobility, lifetime, and continuity equations.</div><div class="prereq"><b>Circuits</b>Current–voltage characteristics, power, and equivalent circuits.</div></div></section>
<div class="callout good"><b>Suggested use.</b> Begin with the metaphor to build intuition, then complete Sections 1–3 in order. Use Section 4 for optical-design and thickness-optimization studies.</div></div>`,init:()=>{}},
{id:'light',num:'1.1',group:'1. Semiconductor & Optical Foundations',title:'Light, Photon Energy, and Bandgap',subtitle:'Relate photon wavelength to energy and determine whether a semiconductor can absorb the photon.',keywords:'light photon wavelength energy bandgap absorption spectrum joules electron volts conversion practice',html:()=>String.raw`
<div class="photonLesson">
  <div class="photonHero">
    <div class="photonHeroIcon">☀</div>
    <div><h3>Light, Photon Energy, and Bandgap</h3><p>Relate wavelength to photon energy, convert joules to electron-volts, and decide if a photon can be absorbed.</p></div>
  </div>

  <section class="photonSection">
    <div class="photonHead"><span class="num">1</span>VISIBLE SPECTRUM (WAVELENGTH IN NANOMETERS)</div>
    <div class="spectrumBar" role="img" aria-label="Visible spectrum from 380 to 750 nanometers"></div>
    <div class="spectrumTicks"><span>380</span><span>400</span><span>450</span><span>500</span><span>550</span><span>600</span><span>650</span><span>700</span><span>750 nm</span></div>
    <div class="spectrumNames"><span style="color:#db73ff">Violet</span><span style="color:#2f9cff">Blue</span><span style="color:#2fe9e0">Cyan</span><span style="color:#8bea00">Green</span><span style="color:#ffe600">Yellow</span><span style="color:#ff9a00">Orange</span><span style="color:#ff4030">Red</span></div>
  </section>

  <div class="photonMainGrid">
    <section class="posterPanel">
      <h3><span class="ico">▣</span>2. CORE EQUATIONS</h3>
      <div class="posterEq">\[E_{ph}=h\nu=\frac{hc}{\lambda}\]</div>
      <div class="posterEq">\[E(\mathrm{eV})\approx\frac{1240}{\lambda(\mathrm{nm})}\]</div>
      <div class="posterEq">\[1\ \mathrm{eV}=1.602\times10^{-19}\ \mathrm{J}\]</div>
      <div class="constantsBox"><b>CONSTANTS</b><br>\(h=6.626\times10^{-34}\ \mathrm{J\,s}\)<br>\(c=2.998\times10^8\ \mathrm{m/s}\)</div>
    </section>

    <section class="posterPanel">
      <h3><span class="ico">⟳</span>3. CONVERSION BETWEEN JOULES AND eV</h3>
      <p class="convertIntro">Elementary charge: \(q=1.602\times10^{-19}\ \mathrm{J/eV}\)</p>
      <div class="convertCard"><b><span class="letter">A</span>Joules to eV</b><div class="math">\[E(\mathrm{eV})=\frac{E(\mathrm{J})}{1.602\times10^{-19}}\]</div></div>
      <div class="convertCard"><b><span class="letter">B</span>eV to Joules</b><div class="math">\[E(\mathrm{J})=E(\mathrm{eV})\times1.602\times10^{-19}\]</div></div>
    </section>

    <section class="posterPanel bandgapWide">
      <h3><span class="ico">⌁</span>4. BANDGAP DECISION</h3>
      <div class="bandCasePro caseA">
        <div class="bandText"><span class="bandRule">E<sub>ph</sub> &lt; E<sub>g</sub></span><p>No band-to-band absorption.</p></div>
        <div class="bandDiagram a"><div class="cb"></div><div class="vb"></div><div class="wave">∿∿→</div><div class="gapLine"></div><div class="eg">E<sub>g</sub></div><div class="cbLabel">Conduction Band</div><div class="vbLabel">Valence Band</div></div>
      </div>
      <div class="bandCasePro caseB">
        <div class="bandText"><span class="bandRule">E<sub>ph</sub> ≥ E<sub>g</sub></span><p>Absorption possible. Electron–hole pair generated.</p></div>
        <div class="bandDiagram b"><div class="cb"></div><div class="vb"></div><div class="wave">∿∿→</div><div class="rise"></div><div class="dot"></div><div class="hole"></div><div class="approxEg">≈ E<sub>g</sub></div><div class="gapLine"></div><div class="eg">E<sub>g</sub></div><div class="cbLabel">Conduction Band</div><div class="vbLabel">Valence Band</div></div>
      </div>
      <div class="bandCasePro caseC">
        <div class="bandText"><span class="bandRule">E<sub>ph</sub> &gt; E<sub>g</sub></span><p>Excess energy is lost as heat (thermalization).</p></div>
        <div class="bandDiagram c"><div class="cb"></div><div class="vb"></div><div class="wave">∿∿→</div><div class="rise"></div><div class="dot"></div><div class="hole"></div><div class="heat">↘</div><div class="gapLine"></div><div class="eg">E<sub>g</sub></div><div class="cbLabel">Conduction Band</div><div class="vbLabel">Valence Band</div></div>
      </div>
    </section>
  </div>

  <div class="practiceKeyGrid">
    <section class="practiceWrap">
      <div class="photonHead">✎ 5. QUICK PRACTICE</div>
      <div class="practiceGrid">
        <div class="practiceCard"><h4>1. Find the photon energy of 620 nm light.</h4><div class="posterEq">\[E(\mathrm{eV})\approx\frac{1240}{620}=2.00\ \mathrm{eV}\]</div><div class="answer">Answer: 2.00 eV</div></div>
        <div class="practiceCard"><h4>2. What wavelength corresponds to 2.00 eV?</h4><div class="posterEq">\[\lambda(\mathrm{nm})\approx\frac{1240}{2.00}=620\ \mathrm{nm}\]</div><div class="answer">Answer: 620 nm</div></div>
        <div class="practiceCard good"><h4>3. Can a 900 nm photon be absorbed by silicon with \(E_g\approx1.12\ \mathrm{eV}\)?</h4><div class="posterEq">\[E_{ph}=\frac{1240}{900}\approx1.38\ \mathrm{eV}\]</div><div class="answer">Answer: Yes; \(1.38>1.12\).</div></div>
      </div>
    </section>

    <section class="keyIdeas">
      <div class="photonHead">☼ 6. KEY IDEAS</div>
      <div class="idea"><span class="ideaIcon" style="color:#25d8ff">∿</span><span>Shorter wavelength → higher photon energy.</span></div>
      <div class="idea"><span class="ideaIcon" style="color:#8bea00">e⁻</span><span>Only photons with \(E_{ph}\ge E_g\) can create electron–hole pairs.</span></div>
      <div class="idea"><span class="ideaIcon" style="color:#ffd000">λ</span><span>\(E(\mathrm{eV})\approx1240/\lambda(\mathrm{nm})\).</span></div>
      <div class="idea"><span class="ideaIcon" style="color:#ff5748">♨</span><span>Excess energy is lost as heat through thermalization.</span></div>
    </section>
  </div>

  <section class="processFooter">
    <div><h4>⚙ CONVERSION PROCESS</h4><p>Convert wavelength to photon energy with \(E_{ph}=hc/\lambda\). Convert joules to eV by dividing by \(1.602\times10^{-19}\), then compare \(E_{ph}\) with \(E_g\) to decide whether absorption is possible.</p></div>
    <div><h4>⚗ CONSTANTS SUMMARY</h4><p>\(h=6.626\times10^{-34}\ \mathrm{J\,s}\), \(c=2.998\times10^8\ \mathrm{m/s}\), and \(1\ \mathrm{eV}=1.602\times10^{-19}\ \mathrm{J}\).</p></div>
  </section>

  <div class="simBox photonExplorer"><span class="badge">Interactive calculation</span><h3>Photon-energy and absorption explorer</h3><p>Move the wavelength and bandgap controls. The graph compares the selected photon energy with the semiconductor bandgap.</p><div class="simGrid"><div class="controls"><div class="ctrl"><label>Wavelength <output id="wlOut"></output></label><input id="wl" type="range" min="300" max="1400" step="5" value="600"></div><div class="ctrl"><label>Bandgap <output id="egOut"></output></label><input id="eg" type="range" min="0.7" max="2.3" step="0.02" value="1.12"></div><div class="metrics"><div class="metric"><b>Photon energy</b><span id="eph">—</span></div><div class="metric"><b>Absorption test</b><span id="absorbTest">—</span></div></div></div><canvas id="photonCanvas" class="plotCanvas" width="1000" height="420"></canvas></div></div>
</div>`,init:initPhoton},
{id:'structure',num:'1.2',group:'1. Semiconductor & Optical Foundations',sub:true,title:'Crystalline-Silicon Solar-Cell Structure and Junction Electrostatics',subtitle:'Identify each device region, then connect doping to space charge, electric field, potential, and carrier-collection pathways.',keywords:'silicon solar cell structure pn junction emitter base depletion doping charge electric field potential passivation contacts',html:()=>String.raw`
<div class="structureLesson">${figPNStructure()}${figElectrostatics()}
<section class="devicePanel"><h3>From materials structure to equations</h3><div class="theoryGrid"><article class="theoryCard"><h4>Built-in potential and depletion width</h4><div class="theoryMath">\[V_{bi}=V_T\ln\!\left(\frac{N_A N_D}{n_i^2}\right)\]</div><div class="theoryMath">\[W=\sqrt{\frac{2\varepsilon_s}{q}\left(\frac{1}{N_A}+\frac{1}{N_D}\right)(V_{bi}-V)}\]</div><p class="theoryExplain">The depletion region extends farther into the more lightly doped side. Forward bias narrows it; reverse bias widens it.</p></article><article class="theoryCard"><h4>Field and charge neutrality</h4><div class="theoryMath">\[N_Dx_n=N_Ax_p\]</div><div class="theoryMath">\[|E_{max}|=\frac{qN_Dx_n}{\varepsilon_s}=\frac{qN_Ax_p}{\varepsilon_s}\]</div><p class="theoryExplain">These relations connect fabrication choices—emitter and base doping—to junction field and depletion partition.</p></article><article class="theoryCard"><h4>Drift–diffusion current</h4><div class="theoryMath">\[J_n=q\mu_n nE+qD_n\frac{dn}{dx}\]</div><div class="theoryMath">\[J_p=q\mu_p pE-qD_p\frac{dp}{dx}\]</div><p class="theoryExplain">Drift dominates inside the space-charge region, while minority-carrier diffusion is central in the quasi-neutral emitter and base.</p></article><article class="theoryCard"><h4>Continuity and recombination</h4><div class="theoryMath">\[\frac{dJ_n}{dx}=q(G-R),\qquad \frac{dJ_p}{dx}=-q(G-R)\]</div><p class="theoryExplain">Optical generation and recombination determine how current changes with position. At steady state the total current remains conserved.</p></article></div></section>
<div class="lossStrip"><div class="key"><b>Front design</b>Antireflection coating, passivation, shallow emitter, and low shading.</div><div class="key"><b>Base design</b>Strong absorption, long minority-carrier lifetime, and suitable thickness.</div><div class="key"><b>Rear design</b>Back-surface field, passivation, optical reflection, and low contact loss.</div><div class="key"><b>Junction design</b>Doping and junction depth balance voltage, collection, and recombination.</div></div></div>`,init:()=>{}},

<div class="card"><h3>Why this plot matters in solar-cell physics</h3><p>The absorption coefficient \(\alpha(\lambda)\) is one of the most important material functions in photovoltaics because it directly determines where in the device photons are absorbed and therefore where electron–hole pairs are created. In a semiconductor with complex refractive index \(\tilde{n}=n-ik\), the absorption coefficient is related to the extinction coefficient by</p><div class="eqBox">\[\alpha(\lambda)=\frac{4\pi k(\lambda)}{\lambda}.\]</div><p>Large \(\alpha\) means that light is absorbed near the front surface, whereas small \(\alpha\) means that the optical field penetrates more deeply before being attenuated. The figure therefore immediately explains why wide-bandgap direct semiconductors such as GaAs absorb strongly over a short distance, while indirect semiconductors such as Si generally require thicker absorber layers to capture long-wavelength light efficiently.</p></div>

<div class="twoCol"><div class="card"><h3>Beer–Lambert attenuation and penetration depth</h3><p>For monochromatic light entering a homogeneous absorber, the local optical intensity obeys the Beer–Lambert law</p><div class="eqBox">\[I(z,\lambda)=I_0(\lambda)e^{-\alpha(\lambda)z}.\]</div><p>The characteristic penetration depth is the distance for the intensity to fall to \(1/e\) of its incident value:</p><div class="eqBox">\[\delta(\lambda)=\frac{1}{\alpha(\lambda)}.\]</div><p>This is the origin of the right-hand axis in the uploaded plot. If \(\alpha=10^5\,\text{cm}^{-1}\), then \(\delta\approx100\,\text{nm}\). If \(\alpha=10^2\,\text{cm}^{-1}\), then \(\alpha(\lambda)\)0. Thus, short-wavelength photons are usually absorbed near the front, while photons close to the band edge penetrate much more deeply.</p></div><div class="card"><h3>From optical absorption to carrier generation</h3><p>If the front-surface reflectance is \(\alpha(\lambda)\)1 and the incident photon flux is \(\alpha(\lambda)\)2, then the local volumetric generation rate is</p><div class="eqBox">\[G(z,\lambda)=\alpha(\lambda)[1-R(\lambda)]\Phi_0(\lambda)e^{-\alpha(\lambda)z}.\]</div><p>Integrating over wavelength gives the total generation profile:</p><div class="eqBox">\[G(z)=\int_0^{\infty}\alpha(\lambda)[1-R(\lambda)]\Phi_0(\lambda)e^{-\alpha(\lambda)z}\,d\lambda.\]</div><p>Therefore, \(\alpha(\lambda)\) shapes not only the amount of absorbed light but also the spatial location of generation, which then couples directly to minority-carrier transport and collection probability.</p></div></div>

<div class="twoCol"><div class="card"><h3>Material interpretation of the uploaded spectra</h3><p><b>GaAs:</b> The green curve shows a steep absorption edge near the bandgap because GaAs is a direct-bandgap semiconductor. Once \(\alpha(\lambda)\)3, momentum conservation does not require phonon assistance, so \(\alpha\) rises rapidly and thin films can absorb strongly.</p><p><b>Si:</b> The orange dashed curve is much lower near the band edge because Si is an indirect-bandgap semiconductor. Optical transitions close to \(\alpha(\lambda)\)4 require phonon participation, so \(\alpha\) is weaker and practical Si devices use thickness, texturing, and light trapping to compensate.</p><p><b>Ge:</b> The blue curve extends to longer wavelengths because germanium has a smaller bandgap, allowing absorption farther into the infrared.</p><p><b>In<sub>0.53</sub>Ga<sub>0.47</sub>As:</b> The purple curve combines a relatively small bandgap with strong direct absorption, which is why it is attractive for near-infrared photodetectors and multijunction subcells.</p></div><div class="card"><h3>Advanced photovoltaic consequences</h3><p>The absorbed fraction of a film of thickness \(\alpha(\lambda)\)5 is</p><div class="eqBox">\[A(\lambda,d)=1-e^{-\alpha(\lambda)d}.\]</div><p>The mean generation depth for a semi-infinite absorber is</p><div class="eqBox">\[\langle z \rangle =\frac{\int_0^{\infty} z\,\alpha e^{-\alpha z}\,dz}{\int_0^{\infty} \alpha e^{-\alpha z}\,dz}=\frac{1}{\alpha}.\]</div><p>The photocurrent density can then be written in a compact transport-aware form as</p><div class="eqBox">\[J_{ph}=q\int_0^{\infty}\!\int_0^d G(z,\lambda)\,CP(z,\lambda)\,dz\,d\lambda.\]</div><p>where \(\alpha(\lambda)\)6 is the collection probability. This equation shows why optical design and electrical design cannot be separated: a wavelength may be strongly absorbed, yet still contribute weakly to \(\alpha(\lambda)\)7 if it generates carriers in a region with poor collection.</p></div></div>

<div class="callout"><b>Key design message.</b> The ideal absorber is not simply the material with the largest \(\alpha\). A practical solar cell requires the right combination of bandgap, strong above-bandgap absorption, long minority-carrier diffusion length, low surface recombination, and a thickness compatible with both optical capture and carrier extraction.</div>

<div class="simBox"><span class="badge">Interactive extension</span><h3>Absorption-depth simulator</h3><p>Use the simulation below to connect the absorption coefficient to penetration depth, absorbed fraction, and the spatial generation profile. This gives a direct visual bridge between the uploaded material spectra and the one-dimensional Beer–Lambert model.</p><div class="simGrid"><div class="controls"><div class="ctrl"><label>log₁₀ absorption coefficient (cm⁻¹) <output id="alphaOut"></output></label><input id="alpha" type="range" min="3" max="6" step="0.05" value="5"></div><div class="ctrl"><label>Active-layer thickness <output id="thickOut"></output></label><input id="thick" type="range" min="50" max="1000" step="10" value="150"></div><div class="metrics"><div class="metric"><b>Absorbed fraction</b><span id="absFrac">—</span></div><div class="metric"><b>1/e depth</b><span id="penDepth">—</span></div></div></div><canvas id="absCanvas" class="plotCanvas" width="1000" height="430"></canvas></div></div>`,init:initAbsorption},

<div class="pvTopic"><div class="pvIntro"><h3>Light creates both current and voltage</h3><p>Absorption creates excess electrons and holes. Selective contacts and the junction field produce directional collection, while nonequilibrium carrier populations split the electron and hole quasi-Fermi levels.</p></div>

<div class="twoCol"><div class="card"><h3>Drift and diffusion</h3><div class="eqBox">\[J_n=q\mu_n nE+qD_n\frac{dn}{dx},\qquad J_p=q\mu_p pE-qD_p\frac{dp}{dx}\]</div><p>The built-in electric field drives electrons and holes in opposite directions, while concentration gradients also produce diffusion. Minority carriers generated in the quasi-neutral regions must diffuse toward the depletion region before they can be swept apart efficiently.</p></div><div class="card"><h3>Collection criterion</h3><p>A simple teaching estimate compares the transit time with the carrier lifetime.</p><div class="eqBox">\[t_{tr}\sim \frac{L^2}{\mu V_{eff}},\qquad P_{coll}\approx e^{-t_{tr}/\tau}\]</div><p>Fast drift, long lifetime, and a short transport distance all increase the probability that a photogenerated carrier is collected before recombination.</p></div></div>

{id:'collection',num:'2.3',group:'2. Junction Photovoltaic Operation',sub:true,title:'Collection Probability',subtitle:'Connect carrier generation position, diffusion length, depletion field, and surface recombination to collection.',keywords:'collection probability diffusion length depletion region surface recombination solar cell',html:()=>String.raw`
<div class="pvTopic"><div class="pvIntro"><h3>Where a carrier is generated matters</h3><p>Carriers created in the depletion region are usually swept apart by the electric field. Carriers created in the quasi-neutral emitter or base must diffuse to the junction before recombining.</p></div>
${figCollection()}
<div class="pvGrid3"><section class="pvTheory"><h3>Depletion region</h3><div class="pvEq">\[CP(x)\approx1\]</div><p>This approximation is good when drift transit time is much shorter than recombination lifetime.</p></section><section class="pvTheory"><h3>Quasi-neutral region</h3><div class="pvEq">\[L_n=\sqrt{D_n\tau_n},\qquad L_p=\sqrt{D_p\tau_p}\]</div><p>Collection falls as the generation point moves several diffusion lengths away from the junction.</p></section><section class="pvTheory"><h3>Simple semi-infinite estimate</h3><div class="pvEq">\[CP(x)\sim e^{-d(x)/L}\]</div><p>Here \(d(x)\) is the distance to the depletion edge and \(L\) is the relevant minority-carrier diffusion length.</p></section></div>
<section class="pvTheory"><h3>Boundary conditions and surface recombination</h3><p>A finite surface recombination velocity \(S\) modifies the minority-carrier boundary condition:</p><div class="pvEq">\[D\left.\frac{d\Delta n}{dx}\right|_{s}=S\,\Delta n_s\]</div><p>High \(S\), short lifetime, or a thick region relative to \(L\) lowers collection. Surface passivation and light trapping must therefore be optimized together.</p></section></div>`,init:()=>{}},
{id:'lightcurrent',num:'2.4',group:'2. Junction Photovoltaic Operation',sub:true,title:'Light-Generated Current',subtitle:'Derive photocurrent from photon flux, absorption, generation, and collection.',keywords:'light generated current photocurrent generation photon flux absorption ideal solar cell',html:()=>String.raw`
<div class="pvTopic"><div class="pvIntro"><h3>From incident photons to current</h3><p>The light-generated current is the charge per second collected from absorbed photons. The optical problem determines where electron–hole pairs are created; the transport problem determines whether they reach the junction and contacts.</p></div>
<div class="pvFlow"><span>spectral irradiance</span><i>→</i><span>photon flux</span><i>→</i><span>absorption</span><i>→</i><span>generation</span><i>→</i><span>collection</span><i>→</i><span>photocurrent</span></div>
<div class="pvGrid2"><section class="pvTheory"><h3>Spectral generation</h3><p>For monochromatic light incident at the surface, spectral irradiance is converted to photon flux by dividing by photon energy:</p><div class="pvEq">\[\Phi_0(\lambda)=\frac{S(\lambda)\lambda}{hc}\]</div><p>With front reflectance \(R(\lambda)\) and absorption coefficient \(\alpha(\lambda)\),</p><div class="pvEq">\[G(x,\lambda)=\alpha(\lambda)[1-R(\lambda)]\Phi_0(\lambda)e^{-\alpha(\lambda)x}\]</div></section>
<section class="pvTheory"><h3>Collected light current</h3><p>The collection probability \(CP(x,\lambda)\) weights the local generation rate:</p><div class="pvEq">\[J_L=q\int_0^{\infty}\!\int_0^W G(x,\lambda)CP(x,\lambda)\,dx\,d\lambda\]</div><div class="pvNote"><b>Ideal limit:</b> if every above-bandgap photon creates one collected pair, \(CP=1\) and the external quantum efficiency approaches unity.</div></section></div><div class="pvRef">Topic organization follows PVEducation’s Solar Cell Operation sequence.</div></div>`,init:()=>{}},
{id:'qe',num:'2.5',group:'2. Junction Photovoltaic Operation',sub:true,title:'Quantum Efficiency',subtitle:'Interpret external and internal quantum efficiency as wavelength-resolved carrier collection metrics.',keywords:'quantum efficiency EQE IQE external internal photons electrons solar cell',html:()=>String.raw`
<div class="pvTopic"><div class="pvIntro"><h3>Electrons collected per incident photon</h3><p>Quantum efficiency is wavelength dependent. It combines optical absorption, carrier generation, and electrical collection into one diagnostic spectrum.</p></div>
${figEQE()}
<div class="pvGrid2"><section class="pvTheory"><h3>External quantum efficiency</h3><div class="pvEq">\[EQE(\lambda)=\frac{\text{collected electrons per second}}{\text{incident photons per second}}\]</div><div class="pvEq">\[EQE(\lambda)=\frac{J_{sc}(\lambda)/q}{\Phi_{inc}(\lambda)}\]</div><p>EQE includes front reflection and parasitic absorption losses.</p></section><section class="pvTheory"><h3>Internal quantum efficiency</h3><div class="pvEq">\[IQE(\lambda)=\frac{EQE(\lambda)}{1-R(\lambda)-T(\lambda)}\]</div><p>IQE references absorbed photons in the active semiconductor and therefore isolates carrier-generation and collection quality more directly.</p></section></div>
<section class="pvTheory"><h3>How to read an EQE curve</h3><table class="pvTable"><tr><th>Region</th><th>Likely limitation</th></tr><tr><td>Short wavelength</td><td>Front-surface recombination, emitter loss, window or coating absorption</td></tr><tr><td>Middle wavelengths</td><td>Bulk collection and optical reflection</td></tr><tr><td>Long wavelength near the band edge</td><td>Weak absorption, insufficient thickness, rear-surface recombination</td></tr></table></section></div>`,init:()=>{}},
{id:'spectralresponse',num:'2.6',group:'2. Junction Photovoltaic Operation',sub:true,title:'Spectral Response',subtitle:'Relate current per incident optical watt to quantum efficiency.',keywords:'spectral response responsivity A per W quantum efficiency wavelength',html:()=>String.raw`
<div class="pvTopic"><div class="pvIntro"><h3>Current generated per optical watt</h3><p>Spectral response, or responsivity, uses electrical current divided by incident optical power. Unlike quantum efficiency, it weights each photon by its energy.</p></div>
<div class="pvGrid2"><section class="pvTheory"><h3>Relation to EQE</h3><div class="pvEq">\[SR(\lambda)=\frac{J_{sc}(\lambda)}{P_{inc}(\lambda)}=EQE(\lambda)\frac{q\lambda}{hc}\]</div><div class="pvEq">\[SR(\lambda)\,[\mathrm{A/W}]\approx EQE(\lambda)\frac{\lambda(\mathrm{nm})}{1240}\]</div></section><section class="pvTheory"><h3>Why SR rises with wavelength</h3><p>At fixed EQE, longer-wavelength photons carry less energy, so one watt contains more photons. Responsivity therefore increases approximately linearly with wavelength until absorption and collection fall near the band edge.</p><div class="pvNote"><b>Measurement use:</b> integrate \(SR(\lambda)\) against spectral irradiance to predict \(J_{sc}\).</div></section></div><div class="pvEq">\[J_{sc}=\int SR(\lambda)S(\lambda)\,d\lambda\]</div></div>`,init:()=>{}},
{id:'ivcurve',num:'3.1',group:'3. Electrical Characteristics',title:'I–V Curve',subtitle:'Read current, voltage, power, and the maximum-power point from the illuminated diode equation.',keywords:'IV curve solar cell current voltage maximum power point diode equation',html:()=>String.raw`
<div class="pvTopic"><div class="pvIntro"><h3>The operating characteristic</h3><p>The illuminated I–V curve is the dark diode current shifted by the light-generated current. The external load selects one operating point on the curve.</p></div>
${figEquivalentCircuit()}
<div class="pvGrid2"><section class="pvTheory"><h3>Ideal illuminated diode</h3><div class="pvEq">\[J(V)=J_L-J_0\left[\exp\!\left(\frac{qV}{nkT}\right)-1\right]\]</div><p>The delivered-current sign convention is used here: positive current is supplied to the load.</p></section><section class="pvTheory"><h3>Nonideal one-diode model</h3><div class="pvEq">\[J=J_L-J_0\!\left[\exp\!\left(\frac{q(V+JR_s)}{nkT}\right)-1\right]-\frac{V+JR_s}{R_{sh}}\]</div><p>Series resistance rounds the curve near \(V_{oc}\); shunt leakage tilts it near \(J_{sc}\).</p></section></div>
<section class="pvTheory"><h3>Power curve</h3><div class="pvEq">\[P(V)=VJ(V),\qquad \left.\frac{dP}{dV}\right|_{MPP}=0\]</div><div class="pvEq">\[J+V\frac{dJ}{dV}=0\quad\text{at the maximum-power point}\]</div></section></div>`,init:()=>{}},
{id:'electrical',num:'3.2',group:'3. Electrical Characteristics',sub:true,title:'J–V Performance Metrics and Loss Diagnosis',subtitle:'Use one unified framework to analyze the illuminated J–V curve, maximum power, JSC, VOC, fill factor, efficiency, and nonideal losses.',keywords:'illuminated jv pv single diode jsc voc fill factor efficiency maximum power resistance recombination',html:()=>String.raw`
<div class="pvTopic">
<div class="pvIntro"><h3>One curve, four principal metrics</h3><p>The illuminated J–V curve contains the complete terminal behavior of a solar cell. Rather than treating short-circuit current, open-circuit voltage, fill factor, and efficiency as separate topics, this lesson extracts all four quantities from the same one-diode model and connects each metric to its dominant physical losses.</p></div>

<div class="eqBox">\[J=J_{ph}-J_0\!\left[\exp\!\left(\frac{V+JR_s}{nV_T}\right)-1\right]-\frac{V+JR_s}{R_{sh}}\]</div>

<div class="keyGrid"><div class="key"><b>\(J_{SC}\)</b>Current density at \(V=0\). It is governed mainly by photon absorption and carrier collection.</div><div class="key"><b>\(V_{OC}\)</b>Voltage at \(J=0\). It is governed by quasi-Fermi-level splitting and recombination.</div><div class="key"><b>Fill factor</b>The ratio of the actual maximum-power rectangle to \(V_{OC}J_{SC}\).</div><div class="key"><b>Efficiency</b>Maximum electrical output divided by incident optical power.</div></div>

<div class="pvGrid2"><section class="pvTheory"><h3>Short-circuit current</h3><div class="pvEq">\[J_{SC}=q\int EQE(\lambda)\Phi_{inc}(\lambda)\,d\lambda\]</div><p>For a well-designed cell, the diode and shunt currents are small at zero voltage, so \(J_{SC}\approx J_{ph}\). Reflection, incomplete absorption, short diffusion length, and surface recombination reduce this metric.</p></section><section class="pvTheory"><h3>Open-circuit voltage</h3><div class="pvEq">\[V_{OC}=\frac{nkT}{q}\ln\!\left(\frac{J_{ph}}{J_0}+1\right)\]</div><p>Increasing illumination raises \(V_{OC}\) logarithmically. Lower recombination reduces \(J_0\), increases quasi-Fermi-level splitting, and therefore raises \(V_{OC}\).</p></section></div>

<div class="pvGrid2"><section class="pvTheory"><h3>Maximum power and fill factor</h3><div class="pvEq">\[P(V)=VJ(V),\qquad \left.\frac{dP}{dV}\right|_{MPP}=0\]</div><div class="pvEq">\[FF=\frac{V_{MP}J_{MP}}{V_{OC}J_{SC}}\]</div><p>The knee of the J–V curve determines \(V_{MP}\) and \(J_{MP}\). Large series resistance rounds the high-voltage region, while low shunt resistance tilts the curve near short circuit.</p></section><section class="pvTheory"><h3>Power-conversion efficiency</h3><div class="pvEq">\[\eta=\frac{P_{max}}{P_{in}}=\frac{V_{OC}J_{SC}FF}{P_{in}}\]</div><p>Efficiency combines optical generation, recombination, transport, and resistive effects into one system-level metric. Comparisons are meaningful only when spectrum, irradiance, temperature, and active area are specified.</p></section></div>

<section class="pvTheory"><h3>Metric-to-physics diagnostic map</h3><table class="pvTable"><tr><th>Observed change</th><th>Likely physical cause</th><th>Main metric affected</th></tr><tr><td>Lower current across most voltages</td><td>Reflection, parasitic absorption, weak absorber, poor collection</td><td>\(J_{SC}\)</td></tr><tr><td>Lower voltage with similar current</td><td>Higher recombination or larger dark saturation current \(J_0\)</td><td>\(V_{OC}\)</td></tr><tr><td>Rounded knee near open circuit</td><td>Excessive series resistance \(R_s\)</td><td>FF and efficiency</td></tr><tr><td>Strong slope near short circuit</td><td>Low shunt resistance \(R_{sh}\)</td><td>\(J_{SC}\), FF, and efficiency</td></tr><tr><td>All metrics degrade as temperature rises</td><td>Primarily reduced \(V_{OC}\), with smaller changes in current</td><td>\(V_{OC}\), FF, and efficiency</td></tr></table></section>

<div class="simBox"><span class="badge">Unified quantitative simulator</span><h3>Single-Diode J–V / P–V Performance Lab</h3><p>Adjust illumination, temperature, recombination, and resistive parameters. Read all principal photovoltaic metrics from one consistent simulation rather than from separate repeated sections.</p><div class="simGrid"><div class="controls"><div class="ctrl"><label>Irradiance <output id="sunOut"></output></label><input id="sun" type="range" min="0.1" max="1.2" step="0.05" value="1"></div><div class="ctrl"><label>Temperature <output id="tempOut"></output></label><input id="temp" type="range" min="250" max="360" step="2" value="300"></div><div class="ctrl"><label>log₁₀ J₀ (A/cm²) <output id="j0Out"></output></label><input id="j0" type="range" min="-14" max="-7" step="0.1" value="-11"></div><div class="ctrl"><label>Ideality factor <output id="nOut"></output></label><input id="nfac" type="range" min="1" max="2" step="0.02" value="1.2"></div><div class="ctrl"><label>Series resistance (Ω·cm²) <output id="rsOut"></output></label><input id="rs" type="range" min="0" max="8" step="0.1" value="0.8"></div><div class="ctrl"><label>Shunt resistance (Ω·cm²) <output id="rshOut"></output></label><input id="rsh" type="range" min="100" max="5000" step="50" value="2000"></div><div class="metrics"><div class="metric"><b>JSC</b><span id="jvJsc">—</span></div><div class="metric"><b>VOC</b><span id="jvVoc">—</span></div><div class="metric"><b>MPP</b><span id="jvMpp">—</span></div><div class="metric"><b>Efficiency</b><span id="jvEta">—</span></div></div></div><div class="canvasWrap"><canvas id="jvCanvas" class="plotCanvas" width="1000" height="430"></canvas><canvas id="pvCanvas" class="plotCanvas miniPlot" width="1000" height="330"></canvas></div></div></div>

<div class="callout good"><b>Unified interpretation.</b> \(J_{SC}\) is primarily an optical-and-collection metric; \(V_{OC}\) is primarily a recombination metric; fill factor is primarily a curve-shape and resistance metric; efficiency is the combined result of all three.</div>
</div>`,init:initJV},

.beginPath();c.arc(x,y-sep*.55,5,0,Math.PI*2);c.fill();}c.strokeStyle=T.accent;c.lineWidth=4;c.beginPath();c.moveTo(x1+10,y0+18);c.lineTo(w-36,y0+18);c.lineTo(w-36,y1+18);c.lineTo(x1+10,y1+18);c.stroke();c.fillStyle=T.text;c.font='bold 15px Inter';c.fillText('external load',w-145,h/2);const knobY=y0+18+(y1-y0)*load;c.fillStyle=T.accent;c.beginPath();c.arc(w-36,knobY,8,0,Math.PI*2);c.fill();c.fillStyle=T.body;c.font='13px Inter';c.fillText('photons',20,38);c.fillText('e⁻',x1-10,y1-52);c.fillText('h⁺',x1-10,y0+64);}function loop(){t+=.016;update();animationHandle=requestAnimationFrame(loop);}loop();}

function solveJ(V,p){let J=p.Jph;for(let k=0;k<60;k++){const arg=Math.min(70,(V+J*p.Rs)/(p.n*p.Vt));const ex=Math.exp(arg);const f=J-p.Jph+p.J0*(ex-1)+(V+J*p.Rs)/p.Rsh;const df=1+p.J0*ex*p.Rs/(p.n*p.Vt)+p.Rs/p.Rsh;const d=f/df;J-=d;if(Math.abs(d)<1e-10)break;}return J;}
function jvData(p){const pts=[];let voc=0;for(let V=0;V<=1.5;V+=.004){const J=solveJ(V,p);pts.push({V,J,P:V*Math.max(0,J)});if(J>0)voc=V;}let m=pts[0];pts.forEach(x=>{if(x.P>m.P)m=x});return{pts,jsc:solveJ(0,p),voc,m};}
function initJV(){['sun','temp','j0','nfac','rs','rsh'].forEach(id=>bindRange(id,update));update();function update(){const T=+temp.value,p={Jph:.034*(+sun.value),J0:10**(+j0.value),n:+nfac.value,Vt:kB*T/q,Rs:+rs.value,Rsh:+rsh.value};sunOut.textContent=(+sun.value).toFixed(2)+' sun';tempOut.textContent=T+' K';j0Out.textContent=p.J0.toExponential(1);nOut.textContent=p.n.toFixed(2);rsOut.textContent=p.Rs.toFixed(1);rshOut.textContent=p.Rsh.toFixed(0);const d=jvData(p),ff=d.m.P/Math.max(1e-9,d.jsc*d.voc),eta=d.m.P/.1*100;jvJsc.textContent=(d.jsc*1000).toFixed(1)+' mA/cm²';jvVoc.textContent=d.voc.toFixed(3)+' V';jvMpp.textContent=(d.m.V).toFixed(3)+' V, '+(d.m.J*1000).toFixed(1)+' mA/cm²';jvEta.textContent=eta.toFixed(1)+'%';drawCurve(jvCanvas,d.pts,'J–V','Current density (mA/cm²)',x=>x.J*1000,T=>T.accent,d.m.V,d.m.J*1000);drawCurve(pvCanvas,d.pts,'P–V','Power density (mW/cm²)',x=>x.P*1000,T=>T.sun,d.m.V,d.m.P*1000);}function drawCurve(canvas,pts,xlab,ylab,yfun,colorFun,mx,my){const {c,w,h}=ctxSetup(canvas),T=themeColors();c.clearRect(0,0,w,h);axes(c,w,h,'Voltage (V)',ylab);const xmax=1.5,vals=pts.map(yfun),ymax=Math.max(...vals)*1.08||1;const X=x=>58+x.V/xmax*(w-82),Y=y=>h-46-y/ymax*(h-70);c.strokeStyle=colorFun(T);c.lineWidth=3;c.beginPath();pts.forEach((p,i)=>{const x=X(p),y=Y(yfun(p));i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();c.fillStyle=T.red;c.beginPath();c.arc(58+mx/xmax*(w-82),Y(my),7,0,Math.PI*2);c.fill();}}
function initLosses(){['lossRec','lossRs','lossRsh','shade'].forEach(id=>bindRange(id,update));update();function update(){const rec=+lossRec.value,Rs=+lossRs.value,Rsh=+lossRsh.value,sh=+shade.value;lossRecOut.textContent=Math.round(rec*100)+'%';lossRsOut.textContent=Rs.toFixed(1)+' Ω·cm²';lossRshOut.textContent=Rsh.toFixed(0)+' Ω·cm²';shadeOut.textContent=Math.round(sh*100)+'%';const p={Jph:.034*(1-sh)*(1-.22*rec),J0:1e-11*10**(3*rec),n:1.2+.45*rec,Vt:kB*300/q,Rs,Rsh},d=jvData(p);const ideal=jvData({Jph:.034,J0:1e-11,n:1.2,Vt:kB*300/q,Rs:0.2,Rsh:5000});relP.textContent=(d.m.P/ideal.m.P*100).toFixed(1)+'%';const scores={Recombination:rec,Series:Rs/8,Shunt:1-Math.min(1,(Rsh-100)/4900),Shading:sh/.5};domLoss.textContent=Object.entries(scores).sort((a,b)=>b[1]-a[1])[0][0];const {c,w,h}=ctxSetup(lossCanvas),T=themeColors();c.clearRect(0,0,w,h);axes(c,w,h,'Voltage (V)','Current density (mA/cm²)');const datasets=[[ideal.pts,T.muted],[d.pts,T.accent]];datasets.forEach(([pts,col])=>{c.strokeStyle=col;c.lineWidth=3;c.beginPath();pts.forEach((p,i)=>{const x=58+p.V/1.5*(w-82),y=h-46-(p.J*1000/38)*(h-70);i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();});c.fillStyle=T.muted;c.fillText('reference',w-160,34);c.fillStyle=T.accent;c.fillText('with selected losses',w-160,55);}}
function cAdd(a,b){return{re:a.re+b.re,im:a.im+b.im}}function cSub(a,b){return{re:a.re-b.re,im:a.im-b.im}}function cMul(a,b){return{re:a.re*b.re-a.im*b.im,im:a.re*b.im+a.im*b.re}}function cDiv(a,b){const d=b.re*b.re+b.im*b.im;return{re:(a.re*b.re+a.im*b.im)/d,im:(a.im*b.re-a.re*b.im)/d}}function cExpI(z){const e=Math.exp(-z.im);return{re:e*Math.cos(z.re),im:e*Math.sin(z.re)}}function cAbs2(a){return a.re*a.re+a.im*a.im}
function nk(mat,wl,blend){if(mat==='air')return{re:1,im:0};if(mat==='glass')return{re:1.5,im:0};if(mat==='ITO')return{re:1.9,im:.025};if(mat==='PEDOT')return{re:1.55,im:.07};if(mat==='TiO2')return{re:2.3,im:.008};if(mat==='Al')return{re:.8,im:6};const center=blend==='P3HT:PCBM'?520:690,width=blend==='P3HT:PCBM'?110:150,k=.04+.45*Math.exp(-1*(((wl-center)/width)**2));return{re:1.9,im:k};}
function reflectanceStack(wl,layers,blend){const n=[nk('air',wl,blend),...layers.map(x=>nk(x.mat,wl,blend)),nk('Al',wl,blend)];let r=cDiv(cSub(n[n.length-2],n[n.length-1]),cAdd(n[n.length-2],n[n.length-1]));for(let j=n.length-3;j>=0;j--){const nnext=n[j+1],d=layers[j]?.d||0,beta={re:2*Math.PI*nnext.re*d/wl,im:2*Math.PI*nnext.im*d/wl},phase=cExpI({re:2*beta.re,im:2*beta.im});const rij=cDiv(cSub(n[j],n[j+1]),cAdd(n[j],n[j+1]));r=cDiv(cAdd(rij,cMul(r,phase)),cAdd({re:1,im:0},cMul(rij,cMul(r,phase))));}return Math.min(1,cAbs2(r));}
function initTMM(){['blend','ito','pedot','act','tio'].forEach(id=>{const e=document.getElementById(id);e.addEventListener('input',update);e.addEventListener('change',update)});update();function update(){const b=blend.value,layers=[{mat:'glass',d:1000},{mat:'ITO',d:+ito.value},{mat:'PEDOT',d:+pedot.value},{mat:'active',d:+act.value},{mat:'TiO2',d:+tio.value}];itoOut.textContent=ito.value+' nm';pedotOut.textContent=pedot.value+' nm';actOut.textContent=act.value+' nm';tioOut.textContent=tio.value+' nm';const data=[];let sr=0,sa=0;for(let wl=350;wl<=850;wl+=5){const R=reflectanceStack(wl,layers,b),k= nk('active',wl,b).im,alpha=4*Math.PI*k/(wl*1e-7),A0=1-Math.exp(-alpha*(+act.value)*1e-7),A=Math.max(0,Math.min(1,(1-R)*A0*.92));data.push({wl,R,A});sr+=R;sa+=A;}meanR.textContent=(sr/data.length*100).toFixed(1)+'%';meanA.textContent=(sa/data.length*100).toFixed(1)+'%';stackText.innerHTML=`<b>${b}</b><br>Glass | ITO ${ito.value} nm | PEDOT:PSS ${pedot.value} nm | Active ${act.value} nm | TiO₂ ${tio.value} nm | Al`;const {c,w,h}=ctxSetup(tmmCanvas),T=themeColors();c.clearRect(0,0,w,h);axes(c,w,h,'Wavelength (nm)','Fraction');const X=x=>58+(x-350)/500*(w-82),Y=y=>h-46-y*(h-70);[[d=>d.R,T.accent,'R'],[d=>d.A,T.sun,'Active A proxy']].forEach(([fn,col,label],j)=>{c.strokeStyle=col;c.lineWidth=3;c.beginPath();data.forEach((d,i)=>{i?c.lineTo(X(d.wl),Y(fn(d))):c.moveTo(X(d.wl),Y(fn(d)))});c.stroke();c.fillStyle=col;c.fillText(label,w-145,32+j*20);});}}
function initOptimization(){['optBlend','lc','intf'].forEach(id=>{const e=document.getElementById(id);e.addEventListener('input',update);e.addEventListener('change',update)});update();function update(){const b=optBlend.value,L=+lc.value,s=+intf.value,alpha=b==='P3HT:PCBM'?.010:.007,data=[];let best={p:-1,d:0};for(let d=40;d<=400;d+=4){const A=(1-Math.exp(-alpha*d))*(1+s*Math.cos(2*Math.PI*(d-80)/180));const coll=Math.exp(-Math.max(0,d-60)/L);const J=Math.max(0,A*coll),p=J*(.74-.08*d/400);data.push({d,A:Math.max(0,A),J,p});if(p>best.p)best={p,d};}lcOut.textContent=L+' nm';intOut.textContent=s.toFixed(2);optD.textContent=best.d+' nm';optPce.textContent=(best.p/Math.max(...data.map(x=>x.p))*100).toFixed(1)+'% of sweep max';const {c,w,h}=ctxSetup(optCanvas),T=themeColors();c.clearRect(0,0,w,h);axes(c,w,h,'Active thickness (nm)','Normalized response');const X=x=>58+(x-40)/360*(w-82),Y=y=>h-46-y*(h-70);const maxA=Math.max(...data.map(x=>x.A)),maxP=Math.max(...data.map(x=>x.p));[[x=>x.A/maxA,T.sun,'Absorption'],[x=>x.p/maxP,T.accent,'Relative PCE']].forEach(([fn,col,label],j)=>{c.strokeStyle=col;c.lineWidth=3;c.beginPath();data.forEach((d,i)=>{i?c.lineTo(X(d.d),Y(fn(d))):c.moveTo(X(d.d),Y(fn(d)))});c.stroke();c.fillStyle=col;c.fillText(label,w-135,32+j*20);});c.strokeStyle=T.red;c.setLineDash([6,5]);c.beginPath();c.moveTo(X(best.d),20);c.lineTo(X(best.d),h-46);c.stroke();c.setLineDash([]);}}

function initDesignTutor(){designAsk.onclick=()=>{const s=designQuestion.value.toLowerCase();let a='Describe whether the main symptom is low current, low voltage, poor fill factor, or thickness-dependent instability.';if(s.includes('fill')||s.includes('ff')||s.includes('bend'))a='Poor fill factor with bending near open circuit points first to series resistance, mobility imbalance, or extraction barriers. Check contact resistance, transport-layer conductivity, carrier mobility balance, and field-dependent collection. Compare dark and illuminated J–V curves to separate contact/resistive effects from recombination.';else if(s.includes('voc')||s.includes('voltage'))a='Low open-circuit voltage usually indicates a large effective dark current or energetic loss. Inspect bulk and interfacial recombination, contact selectivity, leakage, and donor–acceptor energy alignment. Light-intensity dependence of VOC is especially useful.';else if(s.includes('jsc')||s.includes('current'))a='Low short-circuit current can originate from optical loss or collection loss. Compare measured EQE/absorption with simulated active-layer absorption, then check thickness dependence, mobility, lifetime, and recombination. A high absorption but low EQE indicates an electrical collection problem.';else if(s.includes('thick'))a='A thickness optimum reflects competition between additional absorption and longer transport distance. Compare G(z), collection probability, and JSC versus thickness rather than optimizing absorption alone.';designAnswer.textContent=a;};}
function initQuiz(){const qs=[['A 900 nm photon incident on silicon with Eg≈1.12 eV is:',['Below the bandgap','Energetic enough for band-to-band absorption','Guaranteed to be collected','Equivalent to forward bias'],1],['At thermal equilibrium across a p–n junction:',['Two quasi-Fermi levels are split','The Fermi level is flat','The depletion field is zero','The terminal voltage supplies power'],1],['Photovoltaic open-circuit voltage is most directly associated with:',['Absorber thickness alone','Quasi-Fermi-level splitting','Short-circuit current density','The antireflection-coating color'],1],['Carriers generated in the depletion region are commonly collected by:',['Drift in the built-in field','Only majority-carrier diffusion','Series resistance','Thermalization'],0],['A low long-wavelength EQE in silicon most strongly suggests:',['Poor absorption or rear collection','Excessive photon energy','A larger front-grid area only','A lower bandgap than silicon'],0],['At short circuit:',['V=VOC','Terminal voltage is approximately zero','Net current is zero','Power is maximum'],1],['Large series resistance mainly reduces:',['Bandgap','Fill factor','Photon energy','Built-in potential'],1],['A low shunt resistance produces:',['Internal leakage near short circuit','Higher VOC in all cases','Perfectly rectangular J–V','Longer diffusion length'],0],['The optimum absorber thickness can be less than the maximum-absorption thickness because:',['Collection worsens with transport distance','Bandgap always increases with thickness','Voltage must become zero','Reflection is always unity'],0],['In an organic solar cell, the primary photoexcitation usually reaches a donor–acceptor interface as:',['A depletion approximation','A bound exciton','A metal electron gas','An ionized dopant'],1]];quizArea.innerHTML=qs.map((x,i)=>`<div class="quizCard"><b>${i+1}. ${x[0]}</b>${x[1].map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')}</div>`).join('');gradeQu
